services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tableai-postgres
    environment:
      POSTGRES_USER: tableai
      POSTGRES_PASSWORD: tableai
      POSTGRES_DB: tableai
    ports:
      - "5433:5432"
    volumes:
      - tableai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableai -d tableai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tableai_pgdata:
