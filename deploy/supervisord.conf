[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Co-located PostgreSQL 17 + pgvector — the app database. Data dir is on
# the Fly volume (/workspace/pgdata) so it survives deploys. Starts before
# the backend (lower priority) and is initialized by deploy/entrypoint.sh.
# stopsignal=INT -> fast shutdown (checkpoint + exit) so the next boot
# does not have to crash-recover the WAL.
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /workspace/pgdata
user=postgres
autostart=true
autorestart=true
startretries=9999
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.err
priority=5

# Backend — serves API + static SPA on :8001. Waits for the co-located
# postgres to accept connections, then runs `alembic upgrade head` (every
# deploy — not just first boot — because new revisions ship with new code),
# then execs uvicorn. No --reload (immutable per release).
[program:backend]
command=/bin/bash -lc 'cd /app/backend && until pg_isready -h localhost -q; do sleep 1; done && alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001'
autostart=true
autorestart=true
startretries=9999
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.err
priority=10
